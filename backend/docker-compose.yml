services:
  postgresql:
    image: postgres:16-alpine
    container_name: mta-analytics-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mta_analytics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mta_analytics_password}
      - POSTGRES_DB=${POSTGRES_DB:-mta_analytics}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - mta-analytics-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mta_analytics} -d ${POSTGRES_DB:-mta_analytics}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mta-analytics-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-redis_password}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    networks:
      - mta-analytics-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local

networks:
  mta-analytics-network:
    driver: bridge
